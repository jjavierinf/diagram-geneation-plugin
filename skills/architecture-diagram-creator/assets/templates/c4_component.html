<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component diagram for API Application</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
            min-height: 100vh;
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            color: #2d3748;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .section {
            margin: 2rem 0;
        }

        .section-title {
            font-size: 1.5rem;
            color: #2d3748;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 3px solid #667eea;
        }

        .diagram-container {
            background: #f7fafc;
            border-radius: 12px;
            padding: 2rem;
            margin: 1rem 0;
            overflow-x: auto;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ===== LEGEND ===== */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f7fafc;
            border-radius: 12px;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .legend-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 2px solid #2d3748;
        }

        footer {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 2px solid #e2e8f0;
            text-align: center;
            color: #718096;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .container { padding: 1.5rem; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Internet Banking System</h1>
        <p class="subtitle">C4 Model - Component Diagram</p>

        <div class="section">
            <h2 class="section-title">Component diagram for API Application</h2>
            <div class="diagram-container">
                <svg viewBox="0 0 1200 820" width="1200" height="820"
                     data-c4-level="component" data-c4-scope="API Application">
                    <defs>
                        <marker id="arrowhead" markerWidth="10" markerHeight="10"
                                refX="9" refY="3" orient="auto">
                            <polygon points="0 0, 10 3, 0 6" fill="#707070"/>
                        </marker>
                    </defs>

                    <!-- Single-Page App (external container, top-left) -->
                    <rect x="30" y="20" width="200" height="100" rx="4"
                          data-c4-type="container" data-c4-name="Single-Page Application"
                          data-c4-description="Provides internet banking functionality via browser"
                          fill="#438DD5" stroke="#3C7FC0" stroke-width="2"/>
                    <text x="130" y="52" text-anchor="middle" fill="white"
                          font-size="12" font-weight="bold">Single-Page Application</text>
                    <text x="130" y="68" text-anchor="middle" fill="white"
                          font-size="10">[Container: JavaScript, Angular]</text>
                    <text x="130" y="84" text-anchor="middle" fill="white"
                          font-size="9">Provides banking functionality</text>
                    <text x="130" y="96" text-anchor="middle" fill="white"
                          font-size="9">to customers via browser</text>

                    <!-- Mobile App (external container, top-right) -->
                    <rect x="970" y="20" width="200" height="100" rx="4"
                          data-c4-type="container" data-c4-name="Mobile App"
                          data-c4-description="Provides internet banking functionality via mobile"
                          fill="#438DD5" stroke="#3C7FC0" stroke-width="2"/>
                    <text x="1070" y="52" text-anchor="middle" fill="white"
                          font-size="12" font-weight="bold">Mobile App</text>
                    <text x="1070" y="68" text-anchor="middle" fill="white"
                          font-size="10">[Container: Xamarin]</text>
                    <text x="1070" y="84" text-anchor="middle" fill="white"
                          font-size="9">Provides banking functionality</text>
                    <text x="1070" y="96" text-anchor="middle" fill="white"
                          font-size="9">to customers via mobile</text>

                    <!-- API Application boundary (dashed) -->
                    <rect x="120" y="160" width="960" height="420" rx="6"
                          data-c4-type="boundary" data-c4-name="API Application"
                          fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="8,4"/>
                    <text x="130" y="180" fill="#666666" font-size="12" font-weight="bold">API Application</text>
                    <text x="130" y="194" fill="#666666" font-size="10">[Container: Java, Spring MVC]</text>

                    <!-- Sign In Controller -->
                    <rect x="160" y="220" width="200" height="100" rx="4"
                          data-c4-type="component" data-c4-name="Sign In Controller"
                          data-c4-description="Allows users to sign in"
                          data-c4-technology="Spring MVC Rest Controller"
                          fill="#85BBF0" stroke="#78A8D8" stroke-width="2"/>
                    <text x="260" y="252" text-anchor="middle" fill="black"
                          font-size="12" font-weight="bold">Sign In Controller</text>
                    <text x="260" y="268" text-anchor="middle" fill="black"
                          font-size="10">[Component: Spring MVC]</text>
                    <text x="260" y="284" text-anchor="middle" fill="black"
                          font-size="9">Allows users to sign in</text>

                    <!-- Accounts Summary Controller -->
                    <rect x="500" y="220" width="200" height="100" rx="4"
                          data-c4-type="component" data-c4-name="Accounts Summary Controller"
                          data-c4-description="Provides customers with account summary"
                          data-c4-technology="Spring MVC Rest Controller"
                          fill="#85BBF0" stroke="#78A8D8" stroke-width="2"/>
                    <text x="600" y="252" text-anchor="middle" fill="black"
                          font-size="12" font-weight="bold">Accounts Summary</text>
                    <text x="600" y="268" text-anchor="middle" fill="black"
                          font-size="10">[Component: Spring MVC]</text>
                    <text x="600" y="284" text-anchor="middle" fill="black"
                          font-size="9">Provides account summary</text>

                    <!-- Reset Password Controller -->
                    <rect x="840" y="220" width="200" height="100" rx="4"
                          data-c4-type="component" data-c4-name="Reset Password Controller"
                          data-c4-description="Allows users to reset passwords"
                          data-c4-technology="Spring MVC Rest Controller"
                          fill="#85BBF0" stroke="#78A8D8" stroke-width="2"/>
                    <text x="940" y="252" text-anchor="middle" fill="black"
                          font-size="12" font-weight="bold">Reset Password</text>
                    <text x="940" y="268" text-anchor="middle" fill="black"
                          font-size="10">[Component: Spring MVC]</text>
                    <text x="940" y="284" text-anchor="middle" fill="black"
                          font-size="9">Allows password reset</text>

                    <!-- Security Component -->
                    <rect x="160" y="400" width="200" height="100" rx="4"
                          data-c4-type="component" data-c4-name="Security Component"
                          data-c4-description="Provides authentication and authorization"
                          data-c4-technology="Spring Bean"
                          fill="#85BBF0" stroke="#78A8D8" stroke-width="2"/>
                    <text x="260" y="432" text-anchor="middle" fill="black"
                          font-size="12" font-weight="bold">Security Component</text>
                    <text x="260" y="448" text-anchor="middle" fill="black"
                          font-size="10">[Component: Spring Bean]</text>
                    <text x="260" y="464" text-anchor="middle" fill="black"
                          font-size="9">Provides authentication</text>

                    <!-- Mainframe Facade -->
                    <rect x="500" y="400" width="200" height="100" rx="4"
                          data-c4-type="component" data-c4-name="Mainframe Banking Facade"
                          data-c4-description="Facade to the mainframe banking system"
                          data-c4-technology="Spring Bean"
                          fill="#85BBF0" stroke="#78A8D8" stroke-width="2"/>
                    <text x="600" y="432" text-anchor="middle" fill="black"
                          font-size="12" font-weight="bold">Mainframe Facade</text>
                    <text x="600" y="448" text-anchor="middle" fill="black"
                          font-size="10">[Component: Spring Bean]</text>
                    <text x="600" y="464" text-anchor="middle" fill="black"
                          font-size="9">Facade to mainframe</text>

                    <!-- Email Component -->
                    <rect x="840" y="400" width="200" height="100" rx="4"
                          data-c4-type="component" data-c4-name="Email Component"
                          data-c4-description="Sends emails to users"
                          data-c4-technology="Spring Bean"
                          fill="#85BBF0" stroke="#78A8D8" stroke-width="2"/>
                    <text x="940" y="432" text-anchor="middle" fill="black"
                          font-size="12" font-weight="bold">Email Component</text>
                    <text x="940" y="448" text-anchor="middle" fill="black"
                          font-size="10">[Component: Spring Bean]</text>
                    <text x="940" y="464" text-anchor="middle" fill="black"
                          font-size="9">Sends emails to users</text>

                    <!-- Database (external container, bottom-left) -->
                    <rect x="30" y="650" width="200" height="100" rx="4"
                          data-c4-type="container" data-c4-name="Database"
                          data-c4-description="Stores user data and credentials"
                          fill="#438DD5" stroke="#3C7FC0" stroke-width="2"/>
                    <text x="130" y="682" text-anchor="middle" fill="white"
                          font-size="12" font-weight="bold">Database</text>
                    <text x="130" y="698" text-anchor="middle" fill="white"
                          font-size="10">[Container: Oracle 12c]</text>
                    <text x="130" y="714" text-anchor="middle" fill="white"
                          font-size="9">Stores user data</text>

                    <!-- Mainframe Banking System (external system, bottom-center) -->
                    <rect x="500" y="650" width="200" height="100" rx="4"
                          data-c4-type="external_system" data-c4-name="Mainframe Banking System"
                          data-c4-description="Stores core banking information"
                          fill="#999999" stroke="#8A8A8A" stroke-width="2"/>
                    <text x="600" y="682" text-anchor="middle" fill="white"
                          font-size="12" font-weight="bold">Mainframe Banking</text>
                    <text x="600" y="698" text-anchor="middle" fill="white"
                          font-size="10">[External System]</text>
                    <text x="600" y="714" text-anchor="middle" fill="white"
                          font-size="9">Core banking information</text>

                    <!-- E-mail System (external system, bottom-right) -->
                    <rect x="970" y="650" width="200" height="100" rx="4"
                          data-c4-type="external_system" data-c4-name="E-mail System"
                          data-c4-description="The external email system"
                          fill="#999999" stroke="#8A8A8A" stroke-width="2"/>
                    <text x="1070" y="682" text-anchor="middle" fill="white"
                          font-size="12" font-weight="bold">E-mail System</text>
                    <text x="1070" y="698" text-anchor="middle" fill="white"
                          font-size="10">[External System]</text>
                    <text x="1070" y="714" text-anchor="middle" fill="white"
                          font-size="9">Sends emails</text>

                    <!-- ===== ARROWS ===== -->

                    <!-- SPA -> Sign In Controller -->
                    <path d="M 80 120 L 80 210 L 160 210 L 160 220"
                          stroke="#707070" stroke-width="2" fill="none"
                          marker-end="url(#arrowhead)" data-c4-label="Makes API calls to"/>
                    <text x="15" y="215" fill="#707070" font-size="9">Makes API calls to</text>

                    <!-- SPA -> Accounts Summary -->
                    <path d="M 230 70 L 460 70 L 460 210 L 600 210 L 600 220"
                          stroke="#707070" stroke-width="2" fill="none"
                          marker-end="url(#arrowhead)" data-c4-label="Makes API calls to"/>

                    <!-- Mobile -> Reset Password -->
                    <path d="M 1070 120 L 1070 145 L 1000 145 L 1000 210 L 940 210 L 940 220"
                          stroke="#707070" stroke-width="2" fill="none"
                          marker-end="url(#arrowhead)" data-c4-label="Makes API calls to"/>
                    <text x="1080" y="138" fill="#707070" font-size="9">Makes API calls to</text>

                    <!-- Sign In Controller -> Security Component -->
                    <path d="M 260 320 L 260 400"
                          stroke="#707070" stroke-width="2" fill="none"
                          marker-end="url(#arrowhead)" data-c4-label="Uses"/>
                    <text x="270" y="365" fill="#707070" font-size="9">Uses</text>

                    <!-- Accounts Summary -> Mainframe Facade -->
                    <path d="M 600 320 L 600 400"
                          stroke="#707070" stroke-width="2" fill="none"
                          marker-end="url(#arrowhead)" data-c4-label="Uses"/>
                    <text x="610" y="365" fill="#707070" font-size="9">Uses</text>

                    <!-- Reset Password -> Security Component -->
                    <path d="M 840 290 L 790 290 L 790 550 L 310 550 L 310 500"
                          stroke="#707070" stroke-width="2" fill="none"
                          marker-end="url(#arrowhead)" data-c4-label="Uses"/>

                    <!-- Reset Password -> Email Component -->
                    <path d="M 940 320 L 940 400"
                          stroke="#707070" stroke-width="2" fill="none"
                          marker-end="url(#arrowhead)" data-c4-label="Uses"/>
                    <text x="950" y="365" fill="#707070" font-size="9">Uses</text>

                    <!-- Security Component -> Database -->
                    <path d="M 260 500 L 260 590 L 130 590 L 130 650"
                          stroke="#707070" stroke-width="2" fill="none"
                          marker-end="url(#arrowhead)" data-c4-label="Reads from and writes to"/>
                    <text x="200" y="620" text-anchor="middle" fill="#707070" font-size="9">Reads/writes credentials</text>

                    <!-- Mainframe Facade -> Mainframe Banking -->
                    <path d="M 600 500 L 600 650"
                          stroke="#707070" stroke-width="2" fill="none"
                          marker-end="url(#arrowhead)" data-c4-label="Makes API calls to"/>
                    <text x="610" y="580" fill="#707070" font-size="9">Makes API calls to</text>

                    <!-- Email Component -> E-mail System -->
                    <path d="M 940 500 L 940 590 L 1070 590 L 1070 650"
                          stroke="#707070" stroke-width="2" fill="none"
                          marker-end="url(#arrowhead)" data-c4-label="Sends email using"/>
                    <text x="1010" y="620" text-anchor="middle" fill="#707070" font-size="9">Sends email using</text>

                </svg>
            </div>
        </div>

        <!-- Legend -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-box" style="background: #85BBF0;"></div>
                <span>Component</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: #438DD5;"></div>
                <span>Container</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: #999999;"></div>
                <span>External System</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: none; border: 2px dashed #666666;"></div>
                <span>Container Boundary</span>
            </div>
        </div>

        <footer>
            <strong>C4 Component Diagram - API Application</strong><br>
            Internet Banking System | Level 3: Component View
        </footer>
    </div>
</body>
</html>
