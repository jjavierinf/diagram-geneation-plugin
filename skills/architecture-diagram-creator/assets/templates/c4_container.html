<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container diagram for Internet Banking System</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
            min-height: 100vh;
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            color: #2d3748;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .section {
            margin: 2rem 0;
        }

        .section-title {
            font-size: 1.5rem;
            color: #2d3748;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 3px solid #667eea;
        }

        /* ===== DIAGRAMS ===== */
        .diagram-container {
            background: #f7fafc;
            border-radius: 12px;
            padding: 2rem;
            margin: 1rem 0;
            overflow-x: auto;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ===== LEGEND ===== */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f7fafc;
            border-radius: 12px;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .legend-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 2px solid #2d3748;
        }

        /* ===== FOOTER ===== */
        footer {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 2px solid #e2e8f0;
            text-align: center;
            color: #718096;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .container { padding: 1.5rem; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Internet Banking System</h1>
        <p class="subtitle">C4 Model - Container Diagram</p>

        <div class="section">
            <h2 class="section-title">Container diagram for Internet Banking System</h2>
            <div class="diagram-container">
                <svg viewBox="0 0 1200 820" width="1200" height="820"
                     data-c4-level="container" data-c4-scope="Internet Banking System">
                    <defs>
                        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#707070" />
                        </marker>
                    </defs>

                    <!-- Person: Customer (outside boundary, top-left) -->
                    <rect x="50" y="30" width="160" height="100" rx="6" fill="#08427B"
                          data-c4-type="person" data-c4-name="Personal Banking Customer"
                          data-c4-description="A customer of the bank" />
                    <text x="130" y="62" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Personal Banking</text>
                    <text x="130" y="78" text-anchor="middle" fill="white" font-size="10">[Person]</text>
                    <text x="130" y="94" text-anchor="middle" fill="white" font-size="10">A customer of the bank</text>

                    <!-- External System: Email (outside boundary, top-right) -->
                    <rect x="990" y="30" width="160" height="100" rx="6" fill="#999999"
                          data-c4-type="external-system" data-c4-name="E-mail System"
                          data-c4-description="Sendgrid email service" />
                    <text x="1070" y="62" text-anchor="middle" fill="white" font-size="13" font-weight="bold">E-mail System</text>
                    <text x="1070" y="78" text-anchor="middle" fill="white" font-size="10">[External System]</text>
                    <text x="1070" y="94" text-anchor="middle" fill="white" font-size="10">Sendgrid email service</text>

                    <!-- External System: Mainframe (outside boundary, bottom) -->
                    <rect x="450" y="700" width="160" height="100" rx="6" fill="#999999"
                          data-c4-type="external-system" data-c4-name="Mainframe Banking System"
                          data-c4-description="Stores core banking data" />
                    <text x="530" y="732" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Mainframe Banking</text>
                    <text x="530" y="748" text-anchor="middle" fill="white" font-size="10">[External System]</text>
                    <text x="530" y="764" text-anchor="middle" fill="white" font-size="10">Stores core banking data</text>

                    <!-- System Boundary -->
                    <rect x="260" y="180" width="700" height="470" rx="8" fill="none" stroke="#666666"
                          stroke-dasharray="8,4" stroke-width="2"
                          data-c4-type="boundary" data-c4-name="Internet Banking System" />
                    <text x="830" y="200" text-anchor="middle" fill="#666666" font-size="13" font-weight="bold">Internet Banking System</text>
                    <text x="830" y="215" text-anchor="middle" fill="#666666" font-size="10">[Software System]</text>

                    <!-- Container: Web Application -->
                    <rect x="290" y="240" width="160" height="100" rx="6" fill="#438DD5"
                          data-c4-type="container" data-c4-name="Web Application"
                          data-c4-technology="Java and Spring MVC"
                          data-c4-description="Delivers static content and the SPA" />
                    <text x="370" y="268" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Web Application</text>
                    <text x="370" y="284" text-anchor="middle" fill="white" font-size="10">[Container: Java/Spring]</text>
                    <text x="370" y="300" text-anchor="middle" fill="white" font-size="10">Delivers static content</text>
                    <text x="370" y="314" text-anchor="middle" fill="white" font-size="10">and the SPA</text>

                    <!-- Container: Single-Page Application -->
                    <rect x="290" y="420" width="160" height="100" rx="6" fill="#438DD5"
                          data-c4-type="container" data-c4-name="Single-Page Application"
                          data-c4-technology="JavaScript and Angular"
                          data-c4-description="Provides banking functionality via browser" />
                    <text x="370" y="448" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Single-Page App</text>
                    <text x="370" y="464" text-anchor="middle" fill="white" font-size="10">[Container: JS/Angular]</text>
                    <text x="370" y="480" text-anchor="middle" fill="white" font-size="10">Banking functionality</text>
                    <text x="370" y="494" text-anchor="middle" fill="white" font-size="10">via browser</text>

                    <!-- Container: Mobile App -->
                    <rect x="530" y="240" width="160" height="100" rx="6" fill="#438DD5"
                          data-c4-type="container" data-c4-name="Mobile App"
                          data-c4-technology="Xamarin"
                          data-c4-description="Provides banking functionality via mobile" />
                    <text x="610" y="268" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Mobile App</text>
                    <text x="610" y="284" text-anchor="middle" fill="white" font-size="10">[Container: Xamarin]</text>
                    <text x="610" y="300" text-anchor="middle" fill="white" font-size="10">Banking functionality</text>
                    <text x="610" y="314" text-anchor="middle" fill="white" font-size="10">via mobile device</text>

                    <!-- Container: API Application -->
                    <rect x="530" y="420" width="160" height="100" rx="6" fill="#438DD5"
                          data-c4-type="container" data-c4-name="API Application"
                          data-c4-technology="Java and Spring MVC"
                          data-c4-description="Provides Internet Banking API via JSON/HTTPS" />
                    <text x="610" y="448" text-anchor="middle" fill="white" font-size="13" font-weight="bold">API Application</text>
                    <text x="610" y="464" text-anchor="middle" fill="white" font-size="10">[Container: Java/Spring]</text>
                    <text x="610" y="480" text-anchor="middle" fill="white" font-size="10">Provides banking API</text>
                    <text x="610" y="494" text-anchor="middle" fill="white" font-size="10">via JSON/HTTPS</text>

                    <!-- Container: Database (visually taller, narrower) -->
                    <rect x="770" y="380" width="140" height="140" rx="6" fill="#438DD5"
                          data-c4-type="container-db" data-c4-name="Database"
                          data-c4-technology="Oracle 12c"
                          data-c4-description="Stores user data, accounts, transactions" />
                    <text x="840" y="425" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Database</text>
                    <text x="840" y="441" text-anchor="middle" fill="white" font-size="10">[Container: Oracle 12c]</text>
                    <text x="840" y="457" text-anchor="middle" fill="white" font-size="10">Stores user data,</text>
                    <text x="840" y="471" text-anchor="middle" fill="white" font-size="10">accounts, transactions</text>

                    <!-- ===== ARROWS ===== -->

                    <!-- Customer -> Web Application: "Visits using HTTPS" -->
                    <path d="M 130 130 L 130 165 L 370 165 L 370 240" stroke="#707070" stroke-width="1.5" fill="none"
                          marker-end="url(#arrowhead)" data-c4-technology="HTTPS" />
                    <text x="250" y="158" text-anchor="middle" fill="#707070" font-size="10">Visits [HTTPS]</text>

                    <!-- Customer -> Mobile App: "Uses" -->
                    <path d="M 210 60 L 530 60 L 530 240" stroke="#707070" stroke-width="1.5" fill="none"
                          marker-end="url(#arrowhead)" data-c4-technology="Mobile" />
                    <text x="380" y="53" text-anchor="middle" fill="#707070" font-size="10">Uses</text>

                    <!-- Web Application -> SPA: "Delivers to browser" -->
                    <path d="M 370 340 L 370 420" stroke="#707070" stroke-width="1.5" fill="none"
                          marker-end="url(#arrowhead)" data-c4-technology="HTTPS" />
                    <text x="405" y="385" text-anchor="start" fill="#707070" font-size="10">Delivers [HTTPS]</text>

                    <!-- SPA -> API Application: "Makes API calls" -->
                    <path d="M 450 470 L 530 470" stroke="#707070" stroke-width="1.5" fill="none"
                          marker-end="url(#arrowhead)" data-c4-technology="JSON/HTTPS" />
                    <text x="490" y="462" text-anchor="middle" fill="#707070" font-size="10">JSON/HTTPS</text>

                    <!-- Mobile App -> API Application: "Makes API calls" -->
                    <path d="M 610 340 L 610 420" stroke="#707070" stroke-width="1.5" fill="none"
                          marker-end="url(#arrowhead)" data-c4-technology="JSON/HTTPS" />
                    <text x="645" y="385" text-anchor="start" fill="#707070" font-size="10">JSON/HTTPS</text>

                    <!-- API Application -> Database: "Reads/writes" -->
                    <path d="M 690 470 L 770 460" stroke="#707070" stroke-width="1.5" fill="none"
                          marker-end="url(#arrowhead)" data-c4-technology="JDBC" />
                    <text x="740" y="505" text-anchor="middle" fill="#707070" font-size="10">JDBC</text>

                    <!-- API Application -> Email System: "Sends email using" -->
                    <path d="M 690 440 L 720 440 L 720 560 L 975 560 L 975 130 L 1070 130" stroke="#707070" stroke-width="1.5" fill="none"
                          marker-end="url(#arrowhead)" data-c4-technology="SMTP" />
                    <text x="985" y="350" text-anchor="start" fill="#707070" font-size="10">SMTP</text>

                    <!-- API Application -> Mainframe: "Makes API calls" -->
                    <path d="M 610 520 L 560 700" stroke="#707070" stroke-width="1.5" fill="none"
                          marker-end="url(#arrowhead)" data-c4-technology="XML/HTTPS" />
                    <text x="610" y="620" text-anchor="start" fill="#707070" font-size="10">XML/HTTPS</text>

                </svg>
            </div>
        </div>

        <!-- Legend -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-box" style="background: #08427B;"></div>
                <span>Person</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: #438DD5;"></div>
                <span>Container</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: #438DD5; border-style: dashed;"></div>
                <span>Container (Database)</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: #999999;"></div>
                <span>External System</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: none; border: 2px dashed #666666;"></div>
                <span>System Boundary</span>
            </div>
        </div>

        <footer>
            <strong>Internet Banking System - C4 Container Diagram v1.0</strong><br>
            C4 Model Level 2 | Container View
        </footer>
    </div>
</body>
</html>
