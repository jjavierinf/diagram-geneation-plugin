<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test 02 - Five-Lane Architecture</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; }
    .hero { text-align: center; margin-bottom: 30px; }
    .hero h1 { font-size: 2rem; color: #1a1a2e; margin: 0; }
    h2 { color: #2c3e50; margin-top: 30px; }
    .diagram-wrap { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; display: inline-block; }
    svg text { font-family: 'Segoe UI', Arial, sans-serif; }
  </style>
</head>
<body>
  <div class="hero"><h1>Five-Lane Architecture</h1></div>

  <h2>System Architecture Layers</h2>
  <div class="diagram-wrap">
    <svg viewBox="0 0 1200 500" width="1200" height="500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
        </marker>
      </defs>

      <!-- Zone 1: Client Layer -->
      <rect x="20" y="40" width="200" height="400" rx="8" ry="8" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="6,3" />
      <text x="120" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#2980b9">Client Layer</text>
      <rect x="45" y="100" width="150" height="50" rx="5" ry="5" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5" />
      <text x="120" y="130" text-anchor="middle" font-size="12" fill="#1a1a2e">Web App</text>
      <rect x="45" y="180" width="150" height="50" rx="5" ry="5" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5" />
      <text x="120" y="210" text-anchor="middle" font-size="12" fill="#1a1a2e">Mobile App</text>

      <!-- Zone 2: API Gateway -->
      <rect x="250" y="40" width="200" height="400" rx="8" ry="8" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="6,3" />
      <text x="350" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67e22">API Gateway</text>
      <rect x="275" y="120" width="150" height="50" rx="5" ry="5" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5" />
      <text x="350" y="150" text-anchor="middle" font-size="12" fill="#1a1a2e">Load Balancer</text>
      <rect x="275" y="200" width="150" height="50" rx="5" ry="5" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5" />
      <text x="350" y="230" text-anchor="middle" font-size="12" fill="#1a1a2e">Auth Proxy</text>
      <rect x="275" y="280" width="150" height="50" rx="5" ry="5" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5" />
      <text x="350" y="310" text-anchor="middle" font-size="12" fill="#1a1a2e">Rate Limiter</text>

      <!-- Zone 3: Microservices -->
      <rect x="480" y="40" width="200" height="400" rx="8" ry="8" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1.5" stroke-dasharray="6,3" />
      <text x="580" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a085">Microservices</text>
      <rect x="505" y="110" width="150" height="50" rx="5" ry="5" fill="#d1f2eb" stroke="#1abc9c" stroke-width="1.5" />
      <text x="580" y="140" text-anchor="middle" font-size="12" fill="#1a1a2e">User Service</text>
      <rect x="505" y="190" width="150" height="50" rx="5" ry="5" fill="#d1f2eb" stroke="#1abc9c" stroke-width="1.5" />
      <text x="580" y="220" text-anchor="middle" font-size="12" fill="#1a1a2e">Order Service</text>
      <rect x="505" y="270" width="150" height="50" rx="5" ry="5" fill="#d1f2eb" stroke="#1abc9c" stroke-width="1.5" />
      <text x="580" y="300" text-anchor="middle" font-size="12" fill="#1a1a2e">Payment Service</text>

      <!-- Zone 4: Database -->
      <rect x="710" y="40" width="200" height="400" rx="8" ry="8" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="6,3" />
      <text x="810" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e44ad">Database</text>
      <rect x="735" y="120" width="150" height="50" rx="5" ry="5" fill="#e8daef" stroke="#8e44ad" stroke-width="1.5" />
      <text x="810" y="150" text-anchor="middle" font-size="12" fill="#1a1a2e">PostgreSQL</text>
      <rect x="735" y="220" width="150" height="50" rx="5" ry="5" fill="#e8daef" stroke="#8e44ad" stroke-width="1.5" />
      <text x="810" y="250" text-anchor="middle" font-size="12" fill="#1a1a2e">Redis Cache</text>

      <!-- Zone 5: External Services -->
      <rect x="940" y="40" width="200" height="400" rx="8" ry="8" fill="#fdedec" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="6,3" />
      <text x="1040" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">External Services</text>
      <rect x="965" y="120" width="150" height="50" rx="5" ry="5" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5" />
      <text x="1040" y="150" text-anchor="middle" font-size="12" fill="#1a1a2e">Email Provider</text>
      <rect x="965" y="220" width="150" height="50" rx="5" ry="5" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5" />
      <text x="1040" y="250" text-anchor="middle" font-size="12" fill="#1a1a2e">Payment Gateway</text>

      <!-- Horizontal arrows between zones -->
      <line x1="195" y1="125" x2="273" y2="145" stroke="#34495e" stroke-width="1.5" marker-end="url(#arrowhead)" />
      <line x1="195" y1="205" x2="273" y2="225" stroke="#34495e" stroke-width="1.5" marker-end="url(#arrowhead)" />
      <line x1="425" y1="145" x2="503" y2="135" stroke="#34495e" stroke-width="1.5" marker-end="url(#arrowhead)" />
      <line x1="425" y1="225" x2="503" y2="215" stroke="#34495e" stroke-width="1.5" marker-end="url(#arrowhead)" />
      <line x1="425" y1="305" x2="503" y2="295" stroke="#34495e" stroke-width="1.5" marker-end="url(#arrowhead)" />
      <line x1="655" y1="135" x2="733" y2="145" stroke="#34495e" stroke-width="1.5" marker-end="url(#arrowhead)" />
      <line x1="655" y1="215" x2="733" y2="145" stroke="#34495e" stroke-width="1.5" marker-end="url(#arrowhead)" />
      <line x1="655" y1="295" x2="733" y2="245" stroke="#34495e" stroke-width="1.5" marker-end="url(#arrowhead)" />
      <line x1="885" y1="145" x2="963" y2="145" stroke="#34495e" stroke-width="1.5" marker-end="url(#arrowhead)" />
      <line x1="885" y1="245" x2="963" y2="245" stroke="#34495e" stroke-width="1.5" marker-end="url(#arrowhead)" />
    </svg>
  </div>
</body>
</html>
