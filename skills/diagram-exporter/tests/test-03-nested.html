<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test 03 - Nested Containers</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; }
    .hero { text-align: center; margin-bottom: 30px; }
    .hero h1 { font-size: 2rem; color: #1a1a2e; margin: 0; }
    h2 { color: #2c3e50; margin-top: 30px; }
    .diagram-wrap { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; display: inline-block; }
    svg text { font-family: 'Segoe UI', Arial, sans-serif; }
  </style>
</head>
<body>
  <div class="hero"><h1>Nested Containers</h1></div>

  <h2>Cloud Platform Architecture</h2>
  <div class="diagram-wrap">
    <svg viewBox="0 0 900 450" width="900" height="450" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
        </marker>
      </defs>

      <!-- External: Client box -->
      <rect x="30" y="170" width="150" height="70" rx="6" ry="6" fill="#fdebd0" stroke="#e67e22" stroke-width="2" />
      <text x="105" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">Client</text>
      <text x="105" y="218" text-anchor="middle" font-size="11" fill="#666">Requests</text>

      <!-- Arrow from Client to Cloud Platform -->
      <line x1="180" y1="205" x2="248" y2="205" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)" />

      <!-- Outer zone: Cloud Platform -->
      <rect x="260" y="30" width="600" height="390" rx="10" ry="10" fill="#eaf2f8" stroke="#2980b9" stroke-width="2" stroke-dasharray="8,4" />
      <text x="560" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#2980b9">Cloud Platform</text>

      <!-- Middle zone: Processing Cluster -->
      <rect x="310" y="80" width="500" height="310" rx="8" ry="8" fill="#e8f8f5" stroke="#1abc9c" stroke-width="2" stroke-dasharray="6,3" />
      <text x="560" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a085">Processing Cluster</text>

      <!-- Inner boxes: Workers -->
      <rect x="350" y="140" width="130" height="60" rx="5" ry="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5" />
      <text x="415" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">Worker A</text>

      <rect x="520" y="140" width="130" height="60" rx="5" ry="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5" />
      <text x="585" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">Worker B</text>

      <rect x="690" y="140" width="130" height="60" rx="5" ry="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5" />
      <text x="755" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">Worker C</text>

      <!-- Shared Storage inside Processing Cluster -->
      <rect x="440" y="260" width="240" height="60" rx="5" ry="5" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5" />
      <text x="560" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">Shared Storage</text>

      <!-- Arrows from workers down to shared storage -->
      <line x1="415" y1="200" x2="490" y2="258" stroke="#34495e" stroke-width="1.5" marker-end="url(#arrowhead)" />
      <line x1="585" y1="200" x2="560" y2="258" stroke="#34495e" stroke-width="1.5" marker-end="url(#arrowhead)" />
      <line x1="755" y1="200" x2="630" y2="258" stroke="#34495e" stroke-width="1.5" marker-end="url(#arrowhead)" />
    </svg>
  </div>
</body>
</html>
