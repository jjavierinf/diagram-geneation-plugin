<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test 08 - Mixed Line Styles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f6fa; color: #2d3436; }
  .hero { background: linear-gradient(135deg, #e17055, #fdcb6e); padding: 48px 32px; text-align: center; }
  .hero h1 { color: #fff; font-size: 2rem; font-weight: 600; }
  .content { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
  h2 { font-size: 1.4rem; margin-bottom: 16px; color: #2d3436; }
  .diagram-wrap { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 32px; overflow-x: auto; }
  .diagram-wrap svg { display: block; margin: 0 auto; }
</style>
</head>
<body>
<div class="hero"><h1>Mixed Line Styles</h1></div>
<div class="content">
  <h2>Data Path, Monitoring Path, and Feedback Path</h2>
  <div class="diagram-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" width="1100" height="550">
      <defs>
        <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#0984e3" />
        </marker>
        <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#e17055" />
        </marker>
        <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#00b894" />
        </marker>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#2d3436" />
        </marker>
      </defs>

      <!-- === MAIN DATA PATH (solid blue) === -->
      <!-- Ingestion -->
      <rect x="60" y="180" width="200" height="80" rx="10" fill="#74b9ff" stroke="#0984e3" stroke-width="2" />
      <text x="160" y="225" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Ingestion</text>

      <!-- Transform -->
      <rect x="370" y="180" width="200" height="80" rx="10" fill="#74b9ff" stroke="#0984e3" stroke-width="2" />
      <text x="470" y="225" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Transform</text>

      <!-- Data Store -->
      <rect x="680" y="180" width="200" height="80" rx="10" fill="#74b9ff" stroke="#0984e3" stroke-width="2" />
      <text x="780" y="225" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Data Store</text>

      <!-- Main path arrows (solid blue) -->
      <line x1="260" y1="220" x2="360" y2="220" stroke="#0984e3" stroke-width="3" marker-end="url(#arrowhead-blue)" />
      <line x1="570" y1="220" x2="670" y2="220" stroke="#0984e3" stroke-width="3" marker-end="url(#arrowhead-blue)" />

      <!-- === MONITORING PATH (dashed orange) === -->
      <!-- Metrics Collector -->
      <rect x="220" y="390" width="200" height="80" rx="10" fill="#fab1a0" stroke="#e17055" stroke-width="2" />
      <text x="320" y="435" text-anchor="middle" font-size="15" font-weight="600" fill="#2d3436">Metrics Collector</text>

      <!-- Alert Manager -->
      <rect x="530" y="390" width="200" height="80" rx="10" fill="#fab1a0" stroke="#e17055" stroke-width="2" />
      <text x="630" y="435" text-anchor="middle" font-size="15" font-weight="600" fill="#2d3436">Alert Manager</text>

      <!-- Monitoring arrows (dashed orange) -->
      <!-- Ingestion -> Metrics -->
      <line x1="160" y1="260" x2="260" y2="390" stroke="#e17055" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowhead-orange)" />
      <!-- Transform -> Metrics -->
      <line x1="470" y1="260" x2="370" y2="390" stroke="#e17055" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowhead-orange)" />
      <!-- Data Store -> Metrics -->
      <line x1="780" y1="260" x2="680" y2="390" stroke="#e17055" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowhead-orange)" />
      <!-- Metrics -> Alert Manager -->
      <line x1="420" y1="430" x2="520" y2="430" stroke="#e17055" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowhead-orange)" />

      <!-- === FEEDBACK PATH (dashed green) === -->
      <!-- Quality Gate -->
      <rect x="370" y="40" width="200" height="80" rx="10" fill="#55efc4" stroke="#00b894" stroke-width="2" />
      <text x="470" y="85" text-anchor="middle" font-size="15" font-weight="600" fill="#2d3436">Quality Gate</text>

      <!-- Feedback arrows (dashed green) -->
      <!-- Data Store -> Quality Gate -->
      <line x1="780" y1="180" x2="580" y2="80" stroke="#00b894" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowhead-green)" />
      <!-- Quality Gate -> Ingestion (feedback loop) -->
      <line x1="370" y1="80" x2="170" y2="180" stroke="#00b894" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowhead-green)" />

      <!-- Legend -->
      <rect x="870" y="400" width="200" height="110" rx="8" fill="#f8f9fa" stroke="#dfe6e9" stroke-width="1" />
      <line x1="885" y1="425" x2="925" y2="425" stroke="#0984e3" stroke-width="3" />
      <text x="935" y="429" font-size="12" fill="#636e72">Data path (solid)</text>
      <line x1="885" y1="455" x2="925" y2="455" stroke="#e17055" stroke-width="2" stroke-dasharray="8,4" />
      <text x="935" y="459" font-size="12" fill="#636e72">Monitoring (dashed)</text>
      <line x1="885" y1="485" x2="925" y2="485" stroke="#00b894" stroke-width="2" stroke-dasharray="8,4" />
      <text x="935" y="489" font-size="12" fill="#636e72">Feedback (dashed)</text>
    </svg>
  </div>
</div>
</body>
</html>
