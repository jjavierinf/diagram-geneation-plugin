<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test 06 - Bidirectional Flows</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f6fa; color: #2d3436; }
  .hero { background: linear-gradient(135deg, #0984e3, #6c5ce7); padding: 48px 32px; text-align: center; }
  .hero h1 { color: #fff; font-size: 2rem; font-weight: 600; }
  .content { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
  h2 { font-size: 1.4rem; margin-bottom: 16px; color: #2d3436; }
  .diagram-wrap { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 32px; overflow-x: auto; }
  .diagram-wrap svg { display: block; margin: 0 auto; }
</style>
</head>
<body>
<div class="hero"><h1>Bidirectional Flows</h1></div>
<div class="content">
  <h2>REST API / Redis Cache / PostgreSQL Database</h2>
  <div class="diagram-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400">
      <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#2d3436" />
        </marker>
        <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#0984e3" />
        </marker>
        <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#e17055" />
        </marker>
      </defs>

      <!-- Component boxes -->
      <rect x="50" y="140" width="220" height="100" rx="10" fill="#dfe6e9" stroke="#2d3436" stroke-width="2" />
      <text x="160" y="195" text-anchor="middle" font-size="18" font-weight="600" fill="#2d3436">REST API</text>

      <rect x="430" y="140" width="220" height="100" rx="10" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="2" />
      <text x="540" y="195" text-anchor="middle" font-size="18" font-weight="600" fill="#2d3436">Redis Cache</text>

      <rect x="810" y="140" width="220" height="100" rx="10" fill="#81ecec" stroke="#00cec9" stroke-width="2" />
      <text x="920" y="195" text-anchor="middle" font-size="18" font-weight="600" fill="#2d3436">PostgreSQL Database</text>

      <!-- REST API -> Redis Cache (write, solid, top) -->
      <line x1="270" y1="165" x2="420" y2="165" stroke="#0984e3" stroke-width="2" marker-end="url(#arrowhead-blue)" />
      <text x="345" y="158" text-anchor="middle" font-size="11" fill="#0984e3">cache write</text>

      <!-- Redis Cache -> REST API (read, dashed, bottom) -->
      <line x1="430" y1="215" x2="280" y2="215" stroke="#e17055" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowhead-orange)" />
      <text x="355" y="232" text-anchor="middle" font-size="11" fill="#e17055">cache read</text>

      <!-- Redis Cache -> PostgreSQL (write, solid, top) -->
      <line x1="650" y1="165" x2="800" y2="165" stroke="#0984e3" stroke-width="2" marker-end="url(#arrowhead-blue)" />
      <text x="725" y="158" text-anchor="middle" font-size="11" fill="#0984e3">persist</text>

      <!-- PostgreSQL -> Redis Cache (read, dashed, bottom) -->
      <line x1="810" y1="215" x2="660" y2="215" stroke="#e17055" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowhead-orange)" />
      <text x="735" y="232" text-anchor="middle" font-size="11" fill="#e17055">cache warm</text>

      <!-- REST API -> PostgreSQL (write, solid, curved bottom) -->
      <path d="M 160 240 L 160 320 L 920 320 L 920 250" stroke="#0984e3" stroke-width="2" fill="none" marker-end="url(#arrowhead-blue)" />
      <text x="540" y="340" text-anchor="middle" font-size="11" fill="#0984e3">direct write</text>

      <!-- PostgreSQL -> REST API (read, dashed, curved top) -->
      <path d="M 920 140 L 920 60 L 160 60 L 160 130" stroke="#e17055" stroke-width="2" stroke-dasharray="8,4" fill="none" marker-end="url(#arrowhead-orange)" />
      <text x="540" y="52" text-anchor="middle" font-size="11" fill="#e17055">query response</text>

      <!-- Legend -->
      <rect x="30" y="360" width="300" height="30" rx="4" fill="none" stroke="none" />
      <line x1="40" y1="375" x2="80" y2="375" stroke="#0984e3" stroke-width="2" />
      <text x="88" y="379" font-size="12" fill="#636e72">Solid = Write</text>
      <line x1="190" y1="375" x2="230" y2="375" stroke="#e17055" stroke-width="2" stroke-dasharray="8,4" />
      <text x="238" y="379" font-size="12" fill="#636e72">Dashed = Read</text>
    </svg>
  </div>
</div>
</body>
</html>
